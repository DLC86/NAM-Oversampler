name: Apply second phase wait diagnostics

on:
  push:
    branches:
      - diagnostic/phase-worker-wait-modes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diagnostic/phase-worker-wait-modes
          fetch-depth: 0
          show-progress: false

      - name: Temporarily disambiguate UI style anchor
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NeuralAmpModeler/NeuralAmpModelerControls.h')
          text = path.read_text(encoding='utf-8')
          needle = '''const auto radioButtonStyle =
                mRadioButtonStyle.WithValueText(mRadioButtonStyle.valueText.WithSize(mRadioButtonStyle.valueText.mSize - 1.0f));'''
          first = text.find(needle)
          second = text.find(needle, first + len(needle)) if first >= 0 else -1
          if first < 0 or second < 0:
            raise RuntimeError(f'Expected two shared style anchors, found first={first}, second={second}')
          guarded = needle.replace('mRadioButtonStyle.WithValueText',
                                   '/* TEMP_PHASE_WAIT_STYLE_GUARD */ mRadioButtonStyle.WithValueText', 1)
          path.write_text(text[:first] + guarded + text[first + len(needle):], encoding='utf-8')
          PY

      - name: Apply IDLE and SERIAL diagnostics
        id: patch
        shell: bash
        run: |
          set +e
          python3 .github/scripts/add_phase_wait_diagnostics.py > /tmp/phase-patch.log 2>&1
          status=$?
          cat /tmp/phase-patch.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/phase-patch.log .github/diagnostic-patch-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/diagnostic-patch-error.txt
            git commit -m 'Record diagnostic patch error'
            git push origin HEAD:diagnostic/phase-worker-wait-modes
            exit "$status"
          fi

      - name: Restore guarded UI style
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NeuralAmpModeler/NeuralAmpModelerControls.h')
          text = path.read_text(encoding='utf-8')
          marker = '/* TEMP_PHASE_WAIT_STYLE_GUARD */ '
          if text.count(marker) != 1:
            raise RuntimeError('Temporary style guard missing after patch')
          path.write_text(text.replace(marker, '', 1), encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'SpinIdle = 4' NeuralAmpModeler/NeuralAmpModeler.h
          grep -q 'SpinSerial = 5' NeuralAmpModeler/NeuralAmpModeler.h
          grep -q 'void RunSingleWorker' NeuralAmpModeler/NeuralAmpModeler.h
          grep -q '"IDLE", "SERIAL"' NeuralAmpModeler/NeuralAmpModeler.cpp
          grep -q 'multicoreButtonSize = 8.0f' NeuralAmpModeler/NeuralAmpModelerControls.h
          ! grep -q 'TEMP_PHASE_WAIT_STYLE_GUARD' NeuralAmpModeler/NeuralAmpModelerControls.h

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/diagnostic-patch-error.txt
          rm .github/scripts/add_phase_wait_diagnostics.py
          rm .github/workflows/apply-second-phase-wait-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add idle and serial multicore diagnostics'
          git push origin HEAD:diagnostic/phase-worker-wait-modes
