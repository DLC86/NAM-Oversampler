name: Apply second phase wait diagnostics

on:
  push:
    branches:
      - diagnostic/phase-worker-wait-modes
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    # The workflow is intentionally self-removing after applying the source patch.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: diagnostic/phase-worker-wait-modes
          fetch-depth: 0
          show-progress: false

      - name: Fix oversampling-page style selector
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/scripts/add_phase_wait_diagnostics.py')
          text = path.read_text(encoding='utf-8')
          old = '''controls = replace_once(
              controls,
              \'\'\'    const auto radioButtonStyle =
                mRadioButtonStyle.WithValueText(mRadioButtonStyle.valueText.WithSize(mRadioButtonStyle.valueText.mSize - 1.0f));\'\'\',
              \'\'\'    const auto radioButtonStyle =
                mRadioButtonStyle.WithValueText(mRadioButtonStyle.valueText.WithSize(mRadioButtonStyle.valueText.mSize - 1.0f));
              // Six diagnostic states share one row. Use a smaller label and button only
              // for this control so the options remain inside the oversampling page.
              const auto multicoreButtonStyle =
                radioButtonStyle.WithValueText(radioButtonStyle.valueText.WithSize(radioButtonStyle.valueText.mSize - 1.5f));
              const float multicoreButtonSize = 8.0f;\'\'\',
              'compact multicore style',
          )'''
          new = '''compact_style_old = \'\'\'    const auto radioButtonStyle =
            mRadioButtonStyle.WithValueText(mRadioButtonStyle.valueText.WithSize(mRadioButtonStyle.valueText.mSize - 1.0f));\'\'\'
          compact_style_new = \'\'\'    const auto radioButtonStyle =
            mRadioButtonStyle.WithValueText(mRadioButtonStyle.valueText.WithSize(mRadioButtonStyle.valueText.mSize - 1.0f));
          // Six diagnostic states share one row. Use a smaller label and button only
          // for this control so the options remain inside the oversampling page.
          const auto multicoreButtonStyle =
            radioButtonStyle.WithValueText(radioButtonStyle.valueText.WithSize(radioButtonStyle.valueText.mSize - 1.5f));
          const float multicoreButtonSize = 8.0f;\'\'\'
          compact_style_index = controls.rfind(compact_style_old)
          if compact_style_index < 0:
              raise RuntimeError('Oversampling compact style anchor not found')
          controls = (controls[:compact_style_index] + compact_style_new
                      + controls[compact_style_index + len(compact_style_old):])'''
          if old not in text:
              raise RuntimeError('Patch-script style block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Apply IDLE and SERIAL diagnostics
        id: patch
        shell: bash
        run: |
          set +e
          python3 .github/scripts/add_phase_wait_diagnostics.py > /tmp/phase-patch.log 2>&1
          status=$?
          cat /tmp/phase-patch.log
          if [ "$status" -ne 0 ]; then
            git reset --hard HEAD
            cp /tmp/phase-patch.log .github/diagnostic-patch-error.txt
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add .github/diagnostic-patch-error.txt
            git commit -m 'Record diagnostic patch error'
            git push origin HEAD:diagnostic/phase-worker-wait-modes
            exit "$status"
          fi

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q 'SpinIdle = 4' NeuralAmpModeler/NeuralAmpModeler.h
          grep -q 'SpinSerial = 5' NeuralAmpModeler/NeuralAmpModeler.h
          grep -q 'void RunSingleWorker' NeuralAmpModeler/NeuralAmpModeler.h
          grep -q '"IDLE", "SERIAL"' NeuralAmpModeler/NeuralAmpModeler.cpp
          grep -q 'multicoreButtonSize = 8.0f' NeuralAmpModeler/NeuralAmpModelerControls.h

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/diagnostic-patch-error.txt
          rm .github/scripts/add_phase_wait_diagnostics.py
          rm .github/workflows/apply-second-phase-wait-diagnostics.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add idle and serial multicore diagnostics'
          git push origin HEAD:diagnostic/phase-worker-wait-modes
