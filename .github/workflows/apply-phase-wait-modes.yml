name: Apply phase worker wait diagnostics

on:
  push:
    branches:
      - diagnostic/phase-worker-wait-modes
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply diagnostic wait modes
        run: python3 .github/scripts/apply_phase_wait_modes.py

      - name: Validate patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          grep -q '"OFF", "SLEEP", "SPIN", "HYBRID"' NeuralAmpModeler/NeuralAmpModeler.cpp
          grep -q 'ENAMPhaseMulticoreWaitMode::Hybrid' NeuralAmpModeler/NeuralAmpModeler.h
          grep -q 'mHybridWarmWorkerCount' NeuralAmpModeler/NeuralAmpModeler.h

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          rm .github/scripts/apply_phase_wait_modes.py
          rm .github/workflows/apply-phase-wait-modes.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Add phase worker wait diagnostic modes'
          git push origin "HEAD:${GITHUB_REF_NAME}"
