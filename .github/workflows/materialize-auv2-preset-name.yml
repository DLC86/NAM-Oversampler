name: Validate AUv2 preset-name round trip

on:
  push:
    branches:
      - fix-standalone-audio-routing

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: macos-15
    steps:
      - name: Check out patch branch
        uses: actions/checkout@v6
        with:
          ref: fix-standalone-audio-routing
          fetch-depth: 0
          submodules: false

      - name: Update iPlug2 patch commit
        shell: bash
        run: |
          set -euo pipefail
          git submodule update --init iPlug2
          git -C iPlug2 fetch origin cd098b622b5ae7251ce37024409997b3e38f3b4c
          git -C iPlug2 checkout cd098b622b5ae7251ce37024409997b3e38f3b4c
          git submodule update --init --recursive
          git add iPlug2

      - name: Get VST3 SDK
        shell: bash
        run: |
          cd iPlug2/Dependencies/IPlug
          ./download-iplug-sdks.sh

      - name: Get prebuilt libraries
        shell: bash
        run: |
          cd iPlug2/Dependencies
          ./download-prebuilt-libs.sh

      - name: Build macOS Audio Unit
        shell: bash
        run: |
          set -euo pipefail
          cd NeuralAmpModeler/scripts
          ./makedist-mac.sh full zip

      - name: Run auval
        shell: bash
        run: |
          set -euo pipefail
          component="$(find NeuralAmpModeler/build-mac -type d -name 'NAM On Steroids.component' -print -quit)"
          if [[ -z "$component" ]]; then
            echo "Built Audio Unit component not found" >&2
            find NeuralAmpModeler/build-mac -maxdepth 6 -print >&2
            exit 1
          fi

          install_dir="$HOME/Library/Audio/Plug-Ins/Components"
          mkdir -p "$install_dir"
          rm -rf "$install_dir/NAM On Steroids.component"
          cp -R "$component" "$install_dir/"

          killall -9 AudioComponentRegistrar 2>/dev/null || true
          rm -rf "$HOME/Library/Caches/AudioUnitCache" 2>/dev/null || true
          sleep 2

          auval -v aufx 1YEo TTSc 2>&1 | tee auval.log

          if grep -Fq 'Preset name is not retained in retrieved class data' auval.log; then
            echo "AUv2 preset-name round trip still failed" >&2
            exit 1
          fi
          if grep -Fq 'AU VALIDATION FAILED' auval.log; then
            echo "AU validation failed" >&2
            exit 1
          fi
          grep -Fq 'AU VALIDATION SUCCEEDED' auval.log

      - name: Upload auval log
        uses: actions/upload-artifact@v7
        with:
          name: auval-preset-name-log
          path: auval.log

      - name: Remove one-shot workflow
        shell: bash
        run: rm .github/workflows/materialize-auv2-preset-name.yml

      - name: Commit corrected iPlug2 pointer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iPlug2
          git add -u .github/workflows/materialize-auv2-preset-name.yml
          git commit -m "Fix AUv2 preset-name state round trip"
          git push origin HEAD:fix-standalone-audio-routing
