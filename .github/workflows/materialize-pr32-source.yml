name: Materialize PR 32 source fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'pr32-state-linux-fixes' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pr32-state-linux-fixes
      - name: Apply fixes
        shell: bash
        run: |
          python3 .github/scripts/fix_pr32_cpp.py
          python3 .github/scripts/fix_pr32_header.py
          python3 .github/scripts/fix_pr32_unserialization.py
      - name: Commit fixed sources through GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const branch = 'pr32-state-linux-fixes';
            const files = [
              'NeuralAmpModeler/NeuralAmpModeler.cpp',
              'NeuralAmpModeler/NeuralAmpModeler.h',
              'NeuralAmpModeler/Unserialization.cpp'
            ];
            for (const path of files) {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch
              });
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                branch,
                sha: current.data.sha,
                message: `Fix PR 32 compatibility: ${path}`,
                content: fs.readFileSync(path).toString('base64')
              });
            }
