name: Materialize PR 32 source fixes

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'pr32-state-linux-fixes' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pr32-state-linux-fixes
      - name: Apply fixes
        shell: bash
        run: |
          set +e
          python3 .github/scripts/fix_pr32_cpp.py > cpp-fix.log 2>&1
          echo $? > cpp-fix.status
          python3 .github/scripts/fix_pr32_header.py > header-fix.log 2>&1
          echo $? > header-fix.status
          python3 .github/scripts/fix_pr32_unserialization.py > state-fix.log 2>&1
          echo $? > state-fix.status
          git diff --check > diff-check.log 2>&1
          echo $? > diff-check.status
          exit 0
      - name: Upload diagnostics
        uses: actions/upload-artifact@v7
        with:
          name: pr32-materializer-diagnostics
          path: |
            *-fix.log
            *-fix.status
            diff-check.log
            diff-check.status
      - name: Require successful transformations
        shell: bash
        run: |
          cat cpp-fix.log header-fix.log state-fix.log diff-check.log
          test "$(cat cpp-fix.status)" = "0"
          test "$(cat header-fix.status)" = "0"
          test "$(cat state-fix.status)" = "0"
          test "$(cat diff-check.status)" = "0"
      - name: Commit fixed sources through GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const branch = 'pr32-state-linux-fixes';
            const files = [
              'NeuralAmpModeler/NeuralAmpModeler.cpp',
              'NeuralAmpModeler/NeuralAmpModeler.h',
              'NeuralAmpModeler/Unserialization.cpp'
            ];
            for (const path of files) {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: branch
              });
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                branch,
                sha: current.data.sha,
                message: `Fix PR 32 compatibility: ${path}`,
                content: fs.readFileSync(path).toString('base64')
              });
            }
