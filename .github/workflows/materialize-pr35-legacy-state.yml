name: Materialize PR 35 legacy state fix

on:
  push:
    branches: [theme-state-fixes-final]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: theme-state-fixes-final
          fetch-depth: 0
      - name: Apply compatibility fix
        run: |
          python3 .github/scripts/fix_pr35_legacy_state.py
          git diff --check -- NeuralAmpModeler/Unserialization.cpp
      - name: Remove one-shot materializer
        run: |
          rm .github/scripts/fix_pr35_legacy_state.py
          rm .github/workflows/materialize-pr35-legacy-state.yml
      - name: Commit source fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add NeuralAmpModeler/Unserialization.cpp
          git add -u .github/scripts/fix_pr35_legacy_state.py .github/workflows/materialize-pr35-legacy-state.yml
          git commit -m "Fix legacy project state loading for track color"
          git push origin HEAD:theme-state-fixes-final
