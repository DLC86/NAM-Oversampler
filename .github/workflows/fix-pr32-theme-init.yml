name: Fix PR 32 theme member initialization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'pr32-state-linux-fixes' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: pr32-state-linux-fixes
      - name: Remove header dependency on Colors.h
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('NeuralAmpModeler/NeuralAmpModeler.h')
          text = path.read_text(encoding='utf-8')
          old = '  iplug::igraphics::IColor mThemeColor = PluginColors::NAM_THEMECOLOR;'
          new = '  iplug::igraphics::IColor mThemeColor {255, 191, 0, 0};'
          if text.count(old) != 1:
              raise SystemExit('theme member initializer not found exactly once')
          path.write_text(text.replace(old, new, 1), encoding='utf-8', newline='')
          PY
      - name: Commit header through GitHub API
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const branch = 'pr32-state-linux-fixes';
            const path = 'NeuralAmpModeler/NeuralAmpModeler.h';
            const current = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              ref: branch
            });
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path,
              branch,
              sha: current.data.sha,
              message: 'Fix UI-only theme member initialization',
              content: fs.readFileSync(path).toString('base64')
            });
