name: Release Native

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

env:
  PROJECT_DIR: NeuralAmpModeler
  ARTIFACT_NAME: NAM On Steroids

jobs:
  build:
    name: Build
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2022, ubuntu-latest]
        include:
          - os: macos-15
            build_dir: build-mac
          - os: windows-2022
            build_dir: build-win
          - os: ubuntu-latest
            build_dir: build-linux

    steps:
    - name: Check out repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Get VST3 SDK
      run: |
        cd iPlug2/Dependencies/IPlug
        ./download-iplug-sdks.sh
      shell: bash

    - name: Get Prebuilt Libs
      run: |
        cd iPlug2/Dependencies
        ./download-prebuilt-libs.sh
      shell: bash

    - name: Get Archive Name macOS
      id: mac_archivename_step
      if: matrix.os == 'macos-15'
      run: |
        ARCHIVE_NAME=`python3 iPlug2/Scripts/get_archive_name.py ${{env.PROJECT_DIR}} mac full`
        echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
      shell: bash

    - name: Build macOS
      if: matrix.os == 'macos-15'
      run: |
        cd ${{env.PROJECT_DIR}}/scripts
        ./makedist-mac.sh full installer
      shell: bash

    - name: Build Linux VST3
      if: matrix.os == 'ubuntu-latest'
      id: linux_build_step
      run: |
        cd ${{env.PROJECT_DIR}}/scripts
        bash ./makedist-linux.sh
        ZIP_PATH="$(find ../build-linux/out -maxdepth 1 -name '*-linux-vst3.zip' -print -quit)"
        test -n "$ZIP_PATH"
        echo "zip_path=$ZIP_PATH" >> $GITHUB_OUTPUT
        echo "zip_name=$(basename "$ZIP_PATH")" >> $GITHUB_OUTPUT
      shell: bash

    - name: Add msbuild to PATH (Windows)
      if: matrix.os == 'windows-2022'
      uses: microsoft/setup-msbuild@v3

    - name: Setup Python3
      if: matrix.os == 'windows-2022'
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
        architecture: 'x64'

    - name: Get Archive Name Windows
      id: win_archivename_step
      if: matrix.os == 'windows-2022'
      run: |
        ARCHIVE_NAME=`python.exe iPlug2/Scripts/get_archive_name.py ${{env.PROJECT_DIR}} win full`
        echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
      shell: bash

    - name: Build Windows
      if: matrix.os == 'windows-2022'
      run: |
        cd ${{env.PROJECT_DIR}}\scripts
        .\makedist-win.bat full installer
      shell: pwsh

    - name: Upload Linux packages
      if: matrix.os == 'ubuntu-latest'
      uses: actions/upload-artifact@v4
      with:
        name: native-linux
        path: ${{ steps.linux_build_step.outputs.zip_path }}
        if-no-files-found: error

    - name: Upload macOS packages
      if: matrix.os == 'macos-15'
      uses: actions/upload-artifact@v4
      with:
        name: native-macos
        path: |
          ${{ env.PROJECT_DIR }}/${{ matrix.build_dir }}/out/${{ steps.mac_archivename_step.outputs.archive_name }}-dSYMs.zip
          ${{ env.PROJECT_DIR }}/${{ matrix.build_dir }}/out/${{ steps.mac_archivename_step.outputs.archive_name }}.dmg
        if-no-files-found: error

    - name: Upload Windows packages
      if: matrix.os == 'windows-2022'
      uses: actions/upload-artifact@v4
      with:
        name: native-windows
        path: |
          ${{ env.PROJECT_DIR }}/${{ matrix.build_dir }}/out/${{ steps.win_archivename_step.outputs.archive_name }}-pdbs.zip
          ${{ env.PROJECT_DIR }}/${{ matrix.build_dir }}/out/${{ steps.win_archivename_step.outputs.archive_name }}.zip
        if-no-files-found: error

  draft_release:
    name: Save draft release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: packages
          merge-multiple: true
      - name: Attach the packages to a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          tag="${RELEASE_REF#release/}"
          version="$(sed -n 's/^#define PLUG_VERSION_STR "\([^"]*\)".*$/\1/p' NeuralAmpModeler/config.h)"
          test "$tag" = "v$version"
          if gh release view "$tag" --json isDraft --jq .isDraft > draft-status; then
            test "$(cat draft-status)" = true
            gh release edit "$tag" --target "$GITHUB_SHA" --draft
            gh release upload "$tag" packages/* --clobber
          else
            gh release create "$tag" packages/* --target "$GITHUB_SHA" --draft \
              --title "NAM On Steroids $version" --notes-file "$PROJECT_DIR/installer/changelog.txt"
          fi
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
