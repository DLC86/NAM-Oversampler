name: Release Native

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
    branches:
      - "release/v*"

concurrency:
  group: native-build-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  PROJECT_DIR: NeuralAmpModeler
  ARTIFACT_NAME: NAM On Steroids

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: macOS Universal
            build_dir: build-mac
          - os: windows-2022
            platform: Windows x64
            build_dir: build-win
          - os: ubuntu-22.04
            platform: Linux amd64
            linux_arch: amd64
          - os: ubuntu-22.04
            platform: Linux i386
            linux_arch: i386

    steps:
    - name: Check out repository
      uses: actions/checkout@v6
      with:
        submodules: recursive

    - name: Get VST3 SDK
      run: |
        cd iPlug2/Dependencies/IPlug
        ./download-iplug-sdks.sh
      shell: bash

    - name: Get Prebuilt Libs
      if: matrix.linux_arch == null
      run: |
        cd iPlug2/Dependencies
        ./download-prebuilt-libs.sh
      shell: bash

    - name: Get Archive Name macOS
      id: mac_archivename_step
      if: matrix.os == 'macos-15'
      run: |
        ARCHIVE_NAME=`python3 iPlug2/Scripts/get_archive_name.py ${{env.PROJECT_DIR}} mac full`
        echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
      shell: bash

    - name: Build macOS
      if: matrix.os == 'macos-15'
      run: |
        cd ${{env.PROJECT_DIR}}/scripts
        ./makedist-mac.sh full installer
      shell: bash

    - name: Install Linux amd64 build dependencies
      if: matrix.linux_arch == 'amd64'
      run: |
        sudo apt-get update
        sudo apt-get install -y g++-12 libgtk-3-dev libasound2-dev xvfb xauth xdotool imagemagick

    - name: Install Linux i386 build dependencies
      if: matrix.linux_arch == 'i386'
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y g++-12-multilib libgtk-3-dev:i386 libasound2-dev:i386 xvfb xauth xdotool imagemagick

    - name: Build and package Linux
      if: matrix.linux_arch != null
      env:
        NAM_VERIFY_LINUX_UI: "1"
        CC: gcc-12
        CXX: g++-12
        LINUX_ARCH: ${{ matrix.linux_arch }}
      run: bash "./$PROJECT_DIR/scripts/makedist-linux.sh" "$LINUX_ARCH"

    - name: Add msbuild to PATH (Windows)
      if: matrix.os == 'windows-2022'
      uses: microsoft/setup-msbuild@v3

    - name: Setup Python3
      if: matrix.os == 'windows-2022'
      uses: actions/setup-python@v6
      with:
        python-version: '3.x'
        architecture: 'x64'

    - name: Get Archive Name Windows
      id: win_archivename_step
      if: matrix.os == 'windows-2022'
      run: |
        ARCHIVE_NAME=`python.exe iPlug2/Scripts/get_archive_name.py ${{env.PROJECT_DIR}} win full`
        echo "archive_name=$ARCHIVE_NAME" >> $GITHUB_OUTPUT
      shell: bash

    - name: Build Windows
      if: matrix.os == 'windows-2022'
      run: |
        cd ${{env.PROJECT_DIR}}\scripts
        .\makedist-win.bat full installer
      shell: pwsh

    - name: Upload the Linux editor preview
      if: matrix.linux_arch != null
      uses: actions/upload-artifact@v4
      with:
        name: editor-linux-${{ matrix.linux_arch }}
        path: ${{ env.PROJECT_DIR }}/build-linux/${{ matrix.linux_arch }}/out/editor.png
        if-no-files-found: warn

    - name: Upload Linux packages
      if: matrix.linux_arch != null
      uses: actions/upload-artifact@v4
      with:
        name: native-linux-${{ matrix.linux_arch }}
        path: ${{ env.PROJECT_DIR }}/build-linux/${{ matrix.linux_arch }}/out/*.deb
        if-no-files-found: error

    - name: Upload macOS packages
      if: matrix.os == 'macos-15'
      uses: actions/upload-artifact@v4
      with:
        name: native-macos
        path: |
          ${{ env.PROJECT_DIR }}/${{ matrix.build_dir }}/out/${{ steps.mac_archivename_step.outputs.archive_name }}-dSYMs.zip
          ${{ env.PROJECT_DIR }}/${{ matrix.build_dir }}/out/${{ steps.mac_archivename_step.outputs.archive_name }}.dmg
        if-no-files-found: error

    - name: Name the Windows installer
      if: matrix.os == 'windows-2022'
      env:
        ARCHIVE: ${{ steps.win_archivename_step.outputs.archive_name }}
      run: Copy-Item -LiteralPath "$env:PROJECT_DIR/build-win/installer/NAM On Steroids Installer.exe" -Destination "$env:PROJECT_DIR/build-win/out/$env:ARCHIVE-Setup.exe"

    - name: Upload Windows packages
      if: matrix.os == 'windows-2022'
      uses: actions/upload-artifact@v4
      with:
        name: native-windows
        path: |
          ${{ env.PROJECT_DIR }}/${{ matrix.build_dir }}/out/${{ steps.win_archivename_step.outputs.archive_name }}-pdbs.zip
          ${{ env.PROJECT_DIR }}/${{ matrix.build_dir }}/out/${{ steps.win_archivename_step.outputs.archive_name }}.zip
          ${{ env.PROJECT_DIR }}/${{ matrix.build_dir }}/out/${{ steps.win_archivename_step.outputs.archive_name }}-Setup.exe
        if-no-files-found: error

  draft_release:
    name: Save draft release
    if: startsWith(github.ref, 'refs/tags/v') || startsWith(github.ref, 'refs/heads/release/v')
    needs: build
    concurrency:
      group: native-draft-${{ github.ref }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          pattern: native-*
          path: packages
          merge-multiple: true
      - name: Attach the packages to a draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REF: ${{ github.ref_name }}
        run: |
          if [[ "$RELEASE_REF" == release/* ]]; then
            tip="$(git ls-remote origin "refs/heads/$RELEASE_REF" | cut -f1)"
            if [[ "$tip" != "$GITHUB_SHA" ]]; then
              echo "A newer revision of $RELEASE_REF is available."
              exit 0
            fi
          fi
          tag="${RELEASE_REF#release/}"
          version="$(sed -n 's/^#define PLUG_VERSION_STR "\([^"]*\)".*$/\1/p' NeuralAmpModeler/config.h)"
          test "$tag" = "v$version"
          test -f "packages/NAM-On-Steroids-v$version-linux-amd64.deb"
          test -f "packages/NAM-On-Steroids-v$version-linux-i386.deb"
          test -n "$(find packages -maxdepth 1 -name '*-Setup.exe' -print -quit)"
          test -n "$(find packages -maxdepth 1 -name '*.dmg' -print -quit)"
          if gh release view "$tag" --json isDraft --jq .isDraft > draft-status; then
            test "$(cat draft-status)" = true
            gh release edit "$tag" --target "$GITHUB_SHA" --draft
            gh release upload "$tag" packages/* --clobber
          else
            gh release create "$tag" packages/* --target "$GITHUB_SHA" --draft \
              --title "NAM On Steroids $version" --notes-file "$PROJECT_DIR/installer/changelog.txt"
          fi
          test "$(gh release view "$tag" --json isDraft --jq .isDraft)" = true
